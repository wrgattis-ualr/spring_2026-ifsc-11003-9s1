<!doctype html>
<html lang="en">
<head>
  <title>Arkansas Children's Hospital - Arkansas's Premier Pediatric Health Center</title>
  <!-- The title is critically important for search engine optimization and for user accessibility. The title is what appears in the brower tab for users and it's also what appears on search engines. -->
  <meta charset="utf-8" />
  <!-- The character set metatag is to establish which alphanumeric and symbol characters are used for text on your webpage; The utf-8 metatag has to be listed within the first 1024 charactesr of the webpage. -->
  <meta name="description" content="Keyword rich explanation of the site's purpose" />
  <!-- The description metatag functions as an "elevator pitch." The description shows up on search engines beneath your title, describing the content placed within the metatag. It is a crucial element to draw users to your website." -->
  <meta name="author" content="Ryan Gattis" />
  <!-- The author metatag is a custom metatag used to identify the author of this webpage. This is how the professor wants us to sign our work -->
</head>

<body>
  <div id="top"></div>
<!--    -->
  <main>
    <header>

    </header>
    <footer>

    </footer>
  </main>
</body>
